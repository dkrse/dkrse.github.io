# ===== Social-hierarchy dynamics =====

[[publication]]
id        = "candidacy-and-trigger"
title     = "Candidacy and Trigger: A Two-Phase Empirical Model of Hierarchical Collapse"
date      = "2026/05/18"
doi       = "10.48550/arXiv.2605.18925"
pdf_url   = "https://arxiv.org/pdf/2605.18925"
arxiv_id  = "2605.18925"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "hierarchical collapse", "ODE model", "panel data", "machine learning",
  "AUC classification", "structural risk", "external shocks", "formal social theory",
]
abstract = """
A dynamic ODE model of hierarchical asymmetry is examined across 260 countries (1960&ndash;2023)
using multiple international data sources. Cross-sectional analysis gives partial support &mdash;
trade openness and health metrics reduce within-country inequality &mdash; while the annual
time-evolution equation underperforms. A machine-learning classifier achieves 0.91 cross-validated
AUC in distinguishing 29 historical collapses from stable countries, revealing a two-phase pattern:
a chronic risk profile visible roughly a decade before the event and an acute inflection three to
five years prior. The paper rejects purely endogenous causes, proposing instead that structural
factors identify vulnerable nations while external shocks determine the timing of collapse, and
closes with forward-looking predictions for 2026&ndash;2036 evaluation.
"""

[[publication]]
id        = "hierarchy-emergence-threshold"
title     = "When Does Hierarchy Arise? A Threshold Argument for the Dominance of the Pyramid over Flat and Network Structures"
date      = "2026/04/20"
doi       = "10.5281/zenodo.19660419"
pdf_url   = "https://zenodo.org/records/19660419/files/paper-01-en.pdf"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "hierarchy", "organizational structure", "bounded rationality", "Dunbar's number",
  "span of control", "Graicunas", "logarithmic depth", "emergence threshold", "formal social theory",
]
abstract = """
At what population size do flat or network organisations spontaneously transform into hierarchies?
Three independent mechanisms drive the shift: cognitive capacity limits (Dunbar's ~150 threshold),
communication costs scaling as O(N&sup2;), and coordination demands under time pressure. A formula
determines the critical organisational size at which hierarchical structure becomes necessary.
Empirical testing against eight real organisations &mdash; from startups to Walmart, spanning nearly
five orders of magnitude &mdash; shows hierarchical depth growing logarithmically with size, with an
effective branching factor of approximately 6.7.
"""

[[publication]]
id        = "hierarchy-extensions-part-2"
title     = "Extensions of the Model of Hierarchical Structure: External Influence, Localisation of Power, and the Point of Irreversibility (Part II)"
date      = "2026/04/20"
doi       = "10.5281/zenodo.19659722"
pdf_url   = "https://zenodo.org/records/19659722/files/paper-02-en.pdf"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "hierarchical organisations", "institutional decay", "external influence",
  "obedience and power", "irreversibility", "phase transitions", "tipping points",
  "antifragility", "formal social theory",
]
abstract = """
This second part extends the framework in which human hierarchical structures decay over finite
time, through four expansions: active influence functions and external counter-pressure; power as a
multiplicative function of lower-level obedience, introducing mass disobedience as a decay mechanism;
formalisation of irreversibility points with early-warning signals; and psychological steering
mechanisms that explain institutional stability. Real institutions are argued to survive through
antifragile redundancy and silent adaptation rather than optimisation, while acknowledging
computational limits, builder heuristics, and survivorship bias.
"""

[[publication]]
id        = "hierarchy-decay-part-1"
title     = "Hierarchical Structures Composed of Humans Inevitably Decay: A Formal Framework, Models, and a Proof (Part I)"
date      = "2026/04/20"
doi       = "10.5281/zenodo.19659405"
pdf_url   = "https://zenodo.org/records/19659405/files/paper-01-en.pdf"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "hierarchical organisations", "bounded rationality", "organisational decay",
  "stochastic models", "continuous-time Markov chains", "coalition dynamics",
  "iron law of oligarchy", "codification", "formal social theory",
]
abstract = """
Formal mathematical models proving that human-based hierarchical organisations must eventually
collapse. The framework combines finite human lifespans with bounded rationality to demonstrate
decay through stochastic processes. Contributions include an explicit lifetime-bound formula, an
analysis of internal decay via Markov chains, and an examination of coalition dynamics. Bounded
rationality is argued to make hierarchy necessary for large-scale coordination yet to simultaneously
guarantee eventual institutional failure; a central finding is that organisational longevity
increases as decision-making shifts from individual judgement toward codified systems.
"""

# ===== Machine learning / astrophysics =====

[[publication]]
id        = "kan-stellar-classification"
title     = "Kolmogorov–Arnold Networks as Implicit Regularizers: Noise Robustness and Interpretability for Stellar Classification"
date      = "2026/05/27"
doi       = "10.48550/arXiv.2605.29039"
pdf_url   = "https://arxiv.org/pdf/2605.29039"
arxiv_id  = "2605.29039"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "Kolmogorov-Arnold networks", "implicit regularization", "noise robustness",
  "stellar classification", "SDSS", "DESI", "B-splines", "SHAP", "interpretability",
]
abstract = """
Do Kolmogorov&ndash;Arnold Networks (KAN) really resist noise better than MLPs and XGBoost when
classifying stellar objects (star/galaxy/quasar) on 100,000 SDSS DR17 sources? An initial
+9-percentage-point advantage over MLP at SNR&nbsp;=&nbsp;5 vanishes once the baselines receive
equivalent regularization: KAN's robustness stems from <em>implicit</em> regularization via B-spline
activations rather than architecture. Results are confirmed on independent DESI samples; stars
degrade faster than quasars under noise; KAN-native and SHAP feature rankings diverge sharply
(Spearman &minus;0.37); colour features enhance KAN's relative benefit; and a hybrid router for
uncertain predictions improves low-noise accuracy. KAN functions primarily as a convenient
auto-regularizer with built-in interpretability.
"""

[[publication]]
id        = "kan-photometric-noise"
title     = "Does the Implicit-Regularizer View of Kolmogorov–Arnold Networks Survive Real Photometric Noise? A Heteroscedastic Stress-Test on SDSS DR17 and DESI DR1"
date      = "2026/06/05"
doi       = "10.5281/zenodo.20560558"
pdf_url   = "https://zenodo.org/records/20560558/files/paper.pdf"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "Kolmogorov-Arnold networks", "implicit regularization", "heteroscedastic noise",
  "photometric uncertainty", "SDSS DR17", "DESI DR1", "stellar classification", "robustness",
]
abstract = """
A stress-test of whether the implicit-regularizer view of Kolmogorov&ndash;Arnold Networks (KAN 2.0)
survives <em>real</em>, heteroscedastic per-object photometric noise rather than the synthetic
uniform-SNR noise of prior work. Using real per-object uncertainties for 73,302 SDSS DR17 objects
(PSF magnitude errors) and 99,999 DESI DR1 objects (inverse-variance-derived errors), the
equal-baseline comparison between KAN, a weight-decay-regularized MLP, an unregularized MLP, and
XGBoost is re-run under three regimes: uncertainties as input features, per-object real-noise
injection scaled by &alpha;, and magnitude-binned degradation. The equal-baseline equivalence holds.
"""

[[publication]]
id        = "selection-over-speed"
title     = "Selection over Speed: A Geometric Separation and a Falsifiable Program for Machine Problem-Solving Without Consciousness"
date      = "2026/06/03"
doi       = "10.5281/zenodo.20520960"
pdf_url   = "https://zenodo.org/records/20520960/files/paper-en.pdf"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "state-space search", "concentration of measure", "selection vs speed",
  "high-dimensional separation", "statistical-computational gap", "tensor PCA",
  "machine cognition", "verifiability", "learnability",
]
abstract = """
Two linked, falsifiable claims about machine versus human problem solving. First &mdash; <em>selection
over speed</em> &mdash; the AI advantage in structured domains is carried by the quality of selection
among options under a fixed computational budget, not by raw speed, anchored by a geometric separation
result (a globally informed algorithm provably succeeds where any bounded-memory local heuristic
fails). Second, on objectively verifiable problems, solving does not require consciousness or a
subconscious, formalized through a single-modality assumption. The paper lays out a program to test
both claims.
"""

