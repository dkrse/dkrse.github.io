  "computational number theory", "experimental mathematics", "reproducibility",
]
abstract = """
A research line on a subleading correction to Wolf's 1998 heuristic for the count of consecutive
prime gaps. The original preprint (v1) proposes a two-parameter, no-intercept correction
R(g,N)&nbsp;&asymp;&nbsp;a&middot;&radic;&omega;(g)&nbsp;&minus;&nbsp;b&middot;log&nbsp;log&nbsp;N in the
number of distinct prime divisors &omega;(g), fitted over N&nbsp;&isin;&nbsp;[10<sup>5</sup>,
10<sup>13</sup>] (cross-validated median R&sup2;&nbsp;=&nbsp;0.92). Companion and large-scale runs
extend the sieve to N&nbsp;&le;&nbsp;3&times;10<sup>14</sup> with frozen-fit out-of-sample
R&sup2;&nbsp;=&nbsp;0.986 and release reproducible code under the MIT license. A final note then
documents a <em>negative result</em>: refitting against the correct Wolf 2014 baseline (which differs
by a factor of C<sub>g</sub> in the exponent) reduces the claimed amplitude by 78&ndash;95%, showing
the earlier residual was largely an artefact of baseline misspecification; Wolf's drift parameters are
reproduced against Cohen's 2024 tabulation to within 5&times;10<sup>&minus;5</sup>.
"""

