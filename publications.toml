# ===== Environmental dominance =====

[[publication]]
id        = "environmental-dominance-limit"
title     = "The Measurement Limit of Environmental Dominance: Why the Strong Thesis Can Be Neither Confirmed nor Refuted, and What Holds Instead"
date      = "2026/06/07"
doi       = "10.5281/zenodo.20579250"
pdf_url   = "https://zenodo.org/records/20579250/files/paper.pdf"
preprint  = true
language  = "en"
codes     = "JEL: D31, D63, J62, O15"
code_url  = ""
keywords  = [
  "inequality of opportunity", "construct validity", "corporate control",
  "beneficial ownership", "network position", "opacity", "reproducibility",
]
abstract = """
Does the environment dominate capability? The claim is split into a <em>weak</em> reading (resource
dispersion exceeds capability variance) and a <em>strong</em> reading (the environment causally
dominates). Across multiple empirical probes the weak reading holds, but the strong reading cannot be
measured with available data: a quasi-experimental analysis shows environmental factors displace
outcomes, yet capability terms remain unrecoverable. Reframing dominance as network position, visible
board interlocks follow log-normal rather than power-law distributions, while hidden offshore networks
are heavy-tailed; beneficial-ownership recording is bimodal &mdash; nearly absent in public registries
but nearly complete in leaked files &mdash; making opacity a structural property of the recording
system rather than a jurisdiction-specific one.
"""

[[publication]]
id        = "environmental-dominance-empirical"
title     = "Empirical Confirmation of the Environmental-Dominance Inequality: A Direct Decomposition of Var(ln ρ_eff) Across Four Levels of Aggregation"
date      = "2026/05/12"
doi       = "10.48550/arXiv.2605.12037"
pdf_url   = "https://arxiv.org/pdf/2605.12037"
arxiv_id  = "2605.12037"
preprint  = true
language  = "en"
code_url  = ""
keywords  = [
  "inequality", "variance decomposition", "Opportunity Atlas", "World Inequality Database",
  "dominance ratio", "reproducible research", "social mobility",
]
abstract = """
Empirical validation of the environmental-dominance inequality using three public datasets
(Opportunity Atlas, World Bank GDP per capita PPP, World Inequality Database) at four aggregation
levels: U.S. census tracts, between-country, within-country deciles, and the global pooled-individual
distribution. The headline global variance of ln(&rho;<sub>eff</sub>) equals 4.33, yielding a
dominance ratio between 27 and 134. The inequality holds with substantial margins globally and within
country deciles, narrower margins between countries, and near-parity within homogenised U.S. census
tracts. A 1990&ndash;2022 series shows global stability alongside a compositional shift toward
within-country dispersion. The result is robust across income, infant mortality, and incarceration,
but weakens for convergence-driven outcomes such as life expectancy. All computations use SHA-256
hashed inputs in a reproducible framework with accompanying notebooks.
"""

[[publication]]
id        = "environmental-dominance-framework"
title     = "The Dominance of Environment over Entity's Capabilities"
date      = "2026/04/18"
doi       = "10.5281/zenodo.19643143"
pdf_url   = "https://zenodo.org/records/19643143/files/zhrnutie-en.pdf"
arxiv_id  = "2605.02985"
preprint  = true
language  = "en"
codes     = "JEL: D31, D63, J62, O15 · MSC 2020: 91D10, 60C05, 91B15"
code_url  = ""
keywords  = [
  "inequality of opportunity", "combinatorial asymmetry", "intergenerational mobility",
  "meritocracy", "structural discrimination", "accessibility", "formal model",
]
abstract = """
An analytical framework for the probability of individual success based on a single structural
asymmetry between an entity's capacity to explore possibilities, <em>k</em>, and the size of the
possibility space offered by the environment, <em>n</em>, where <em>k</em>&nbsp;&#8810;&nbsp;<em>n</em>.
Introducing an effective density &rho;<sub>eff</sub> of favourable possibilities accessible to a given
entity, success probability is derived as
P&nbsp;&#8776;&nbsp;1&minus;(1&minus;&rho;<sub>eff</sub>)<sup><em>k</em></sup> and its variance
decomposed across a population. While the elasticities &epsilon;<sub>&rho;</sub> and
&epsilon;<sub><em>k</em></sub> are comparable, outcome variance is dominated by
Var(ln&nbsp;&rho;<sub>eff</sub>) whenever it exceeds Var(ln&nbsp;<em>k</em>); a back-of-envelope
calibration indicates this holds by two to three orders of magnitude. The framework unifies geographic
inequality, intergenerational mobility, and accessibility-based discrimination as special cases of the
narrowing of the accessible set A(E,P).
"""

