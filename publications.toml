code_url  = ""
keywords  = [
  "information theory", "rate-distortion", "receiver model", "Shannon channel",
  "adaptive communication", "decision model",
]
abstract = """
Classical Shannon theory treats the receiver as a passive decoder reconstructing the message with
minimum distortion. A real receiver is not optimal: it has limited computation, its own world model,
a decision goal, and an individual interaction history. This conceptual framework incorporates these
explicitly through (i) an extension of the rate-distortion function by the receiver's model and goal,
(ii) learning the receiver's parameters from shared communication history, and (iii) a probabilistic
decision model expressing the cost of adaptation via a measurable function.
"""

